<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jujube Notes</title>
    <meta
      name="description"
      content="一个用来发布画、文字和照片的个人艺术博客。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600&family=Noto+Serif+SC:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=20260709-section-align" />
    <style>
      .banner-art {
        position: relative;
        width: min(980px, 100%);
        aspect-ratio: 16 / 7.4;
        margin: 0 auto;
        padding: 24px;
        overflow: hidden;
        background: #fff;
        border: 1px solid var(--line);
      }

      .banner-art img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .banner-slide + .banner-slide {
        position: absolute;
        inset: 24px;
        width: calc(100% - 48px);
        height: calc(100% - 48px);
      }

      .banner-slide {
        animation: banner-fade 8s ease-in-out infinite;
      }

      .banner-slide:nth-child(2) {
        opacity: 0;
        animation-delay: 4s;
      }

      @keyframes banner-fade {
        0%,
        42% {
          opacity: 1;
        }

        50%,
        92% {
          opacity: 0;
        }

        100% {
          opacity: 1;
        }
      }

      @media (max-width: 980px) {
        .banner-art {
          padding: 18px;
        }

        .banner-slide + .banner-slide {
          inset: 18px;
          width: calc(100% - 36px);
          height: calc(100% - 36px);
        }
      }

      @media (max-width: 640px) {
        .banner-art {
          padding: 12px;
        }

        .banner-slide + .banner-slide {
          inset: 12px;
          width: calc(100% - 24px);
          height: calc(100% - 24px);
        }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="profile">
          <p class="site-mark">JuJube Notes</p>
          <h1>写字、画画、影像，记录一些慢慢留下来的东西。</h1>
        </div>

        <section class="panel">
          <nav class="category-nav" aria-label="文章分类">
            <a href="#paintings">画</a>
            <span class="nav-star">★</span>
            <a href="#notes">随记</a>
          </nav>
        </section>

        <section id="about" class="panel about-panel">
          <h2>关于我</h2>
          <p>comme un arbre.</p>
        </section>
      </aside>

      <main class="main-content">
        <section class="banner">
          <figure class="banner-art">
            <img
              class="banner-slide"
              src="images/home-banner-1.png"
              alt="首页图 1"
            />
            <img
              class="banner-slide"
              src="images/home-banner-2.png"
              alt="首页图 2"
            />
          </figure>
        </section>

        <section id="paintings" class="post-group">
          <div class="group-heading">
            <h2>画</h2>
            <span>Gallery</span>
          </div>
          <div class="gallery-grid">
            <figure class="gallery-card">
              <button
                class="gallery-button"
                type="button"
                data-description="这是黑黑和他的亲兄弟（也可能是姐妹？）小橘哦！小橘现在又在哪里生活呢？ta的性格和黑黑像吗？"
              >
                <img src="images/heihei-and-orange.png" alt="黑黑和小橘" />
              </button>
              <figcaption>黑黑和小橘</figcaption>
            </figure>
            <figure class="gallery-card">
              <button
                class="gallery-button"
                type="button"
                data-description="黑黑被抓住之前在草丛里嚎了几天，因为是雨季，还被淋湿了。所以他刚到家最初几天就得了重感冒，有天晚上还往人脸上吐了一个大鼻涕泡。"
              >
                <img src="images/heihei-rainy-night.png" alt="雨夜中的小黑黑" />
              </button>
              <figcaption>雨夜中的小黑黑</figcaption>
            </figure>
            <figure class="gallery-card">
              <button
                class="gallery-button"
                type="button"
                data-description="救助人姐姐给我发的第一张黑黑的照片，眼睛大大的、脸尖尖的，像个外星人。"
              >
                <img src="images/heihei-purple-blanket.png" alt="盖着紫色毯子的黑黑" />
              </button>
              <figcaption>盖着紫色毯子的黑黑</figcaption>
            </figure>
            <figure class="gallery-card">
              <button
                class="gallery-button"
                type="button"
                data-description="我给黑黑拍的第一张照片，他像个毛球一样趴在纸箱的角落，还自带白色眼线。"
              >
                <img src="images/heihei-first-photo.png" alt="我给黑黑拍的第一张照片" />
              </button>
              <figcaption>第一张照片</figcaption>
            </figure>
            <figure class="gallery-card">
              <button
                class="gallery-button"
                type="button"
                data-description="黑黑刚到家就会用猫砂诶！还把便便埋得很好。谁教他的呢？"
              >
                <img src="images/heihei-poop.png" alt="黑黑拉臭臭" />
              </button>
              <figcaption>黑黑拉臭臭</figcaption>
            </figure>
            <figure class="gallery-card">
              <button
                class="gallery-button"
                type="button"
                data-description="在procreate里发现一个有意思的笔触，立马用来画大头橘橘！"
              >
                <img src="images/juju-closeup.jpg" alt="橘橘大头照" />
              </button>
              <figcaption>橘橘大头照</figcaption>
            </figure>
            <figure class="gallery-card">
              <button
                class="gallery-button"
                type="button"
                data-description="照着YY画的人像，意外的有意思，我可能有画搞笑漫画的天赋。希望早日画出一张他愿意拿来做头像的。"
              >
                <img src="images/sketch-yy.jpg" alt="照着YY照片画的人像" />
              </button>
              <figcaption>照着YY照片画的人像</figcaption>
            </figure>
          </div>
        </section>

        <section id="notes" class="post-group">
          <div class="group-heading group-heading-notes">
            <h2>随记</h2>
          </div>
          <div class="article-grid">
            <article class="article-card">
              <a href="posts/heihei-first-meeting.html" class="card-link">
                <h3>黑黑的故事：初次见面</h3>
              </a>
            </article>
          </div>
        </section>
      </main>
    </div>
    <div class="lightbox" aria-hidden="true">
      <button class="lightbox-backdrop" type="button" aria-label="关闭大图"></button>
      <figure class="lightbox-panel">
        <button class="lightbox-close" type="button" aria-label="关闭大图">×</button>
        <div class="lightbox-layout">
          <img src="" alt="" />
          <figcaption>
            <strong class="lightbox-title"></strong>
            <p class="lightbox-description"></p>
          </figcaption>
        </div>
      </figure>
    </div>
    <script>
      const lightbox = document.querySelector(".lightbox");
      const lightboxImage = lightbox.querySelector("img");
      const lightboxTitle = lightbox.querySelector(".lightbox-title");
      const lightboxDescription = lightbox.querySelector(".lightbox-description");
      const closeLightbox = () => {
        lightbox.classList.remove("is-open");
        lightbox.setAttribute("aria-hidden", "true");
      };

      document.querySelectorAll(".gallery-button").forEach((button) => {
        button.addEventListener("click", () => {
          const image = button.querySelector("img");
          const caption = button.closest(".gallery-card").querySelector("figcaption");
          lightboxImage.src = image.src;
          lightboxImage.alt = image.alt;
          lightboxTitle.textContent = caption.textContent;
          lightboxDescription.textContent = button.dataset.description || "";
          lightbox.classList.add("is-open");
          lightbox.setAttribute("aria-hidden", "false");
        });
      });

      lightbox.querySelector(".lightbox-backdrop").addEventListener("click", closeLightbox);
      lightbox.querySelector(".lightbox-close").addEventListener("click", closeLightbox);
      const sectionLinks = document.querySelectorAll('.category-nav a[href^="#"]');
      let activeSection = null;
      let activeLink = null;

      const setActiveLink = (section) => {
        const nextLink = Array.from(sectionLinks).find(
          (link) => link.getAttribute("href") === `#${section.id}`
        );

        if (activeLink && activeLink !== nextLink) {
          activeLink.classList.remove("is-active");
        }

        if (nextLink) {
          nextLink.classList.add("is-active");
          activeLink = nextLink;
        }
      };

      const focusSection = (section) => {
        if (!section) return;
        if (activeSection && activeSection !== section) {
          activeSection.classList.remove("is-targeted");
        }

        section.classList.add("is-targeted");
        activeSection = section;
        setActiveLink(section);

        const top = section.getBoundingClientRect().top + window.scrollY - 24;
        window.scrollTo({
          top: Math.max(top, 0),
          behavior: "smooth",
        });

        window.clearTimeout(focusSection.timeoutId);
        focusSection.timeoutId = window.setTimeout(() => {
          section.classList.remove("is-targeted");
          if (activeSection === section) {
            activeSection = null;
          }
        }, 900);
      };

      sectionLinks.forEach((link) => {
        link.addEventListener("click", (event) => {
          const targetId = link.getAttribute("href");
          const section = document.querySelector(targetId);
          if (!section) return;

          event.preventDefault();
          history.replaceState(null, "", targetId);
          focusSection(section);
        });
      });

      const initialSection =
        document.querySelector(window.location.hash) || document.querySelector("#paintings");
      if (initialSection) {
        setActiveLink(initialSection);
      }

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeLightbox();
        }
      });
    </script>
  </body>
</html>
